  sing-box:
    image: ghcr.io/sagernet/sing-box:v1.14.2
    container_name: sing_box_container
    volumes:
      - /CURRENT_DIR/sing-box:/etc/sing-box/
    restart: always
    depends_on:
      - vpn
    network_mode: "container:ipsec_server_container"
    command:
      - -D
      - /var/lib/sing-box
      - -c
      - /etc/sing-box/config.json
      - run
    healthcheck:
      test: [ "CMD", "/etc/sing-box/select_config.sh" ]
      interval: 5s
      timeout: 3s
      retries: 1
      start_period: 1s

