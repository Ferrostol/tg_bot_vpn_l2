conn ikev2-cp-client
  left=%defaultroute
  leftcert=CERT_LINK
  leftid=%fromcert
  leftmodecfgclient=yes
  leftrsasigkey=%cert

  right=VPN_IP
  rightid=@DOMAIN
  rightsubnet=0.0.0.0/0
  rightca=%same
  rightrsasigkey=%cert

  authby=rsasig
  ikev2=insist
  narrowing=yes
  auto=start
  ike=aes_gcm_c_256-hmac_sha2_256-ecp_256
  phase2alg=aes_gcm-null
  pfs=no
  ikelifetime=24h
  salifetime=24h
  rekey=yes
  encapsulation=yes
  mobike=yes
  dpddelay=30
  dpdtimeout=120
  retransmit-timeout=300s
  ipsec-interface=yes
  mtu=1380


